<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Therapy - Drawing Kit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .main-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .toolbar {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
        }

        .tool-section {
            margin-bottom: 25px;
        }

        .tool-section h3 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #333;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #333;
        }

        .brush-sizes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .size-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .size-btn:hover,
        .size-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .size-btn .dot {
            background: #333;
            border-radius: 50%;
        }

        .tool-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .tool-btn {
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }

        .tool-btn:hover,
        .tool-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
            color: #667eea;
        }

        .canvas-container {
            flex: 1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(239, 246, 255, 0.9));
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        canvas {
            cursor: crosshair;
            display: block;
        }

        .slider-container {
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .toolbar {
                width: 100%;
                max-height: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🎨 Color Therapy - Drawing Kit</h1>
        <button class="back-btn" onclick="location.href='../games.html'">← Back to Games</button>
    </div>

    <div class="main-container">
        <div class="toolbar">
            <div class="tool-section" style="padding: 12px 14px; background: linear-gradient(135deg, #eef2ff, #f5f3ff); border-radius: 14px; border: 1px solid rgba(99, 102, 241, 0.12);">
                <h3 style="margin-bottom: 8px;">Creative Studio</h3>
                <div style="font-size: 13px; color: #475569; line-height: 1.5;">Choose a mood, paint freely, and reset when you want a fresh creative start.</div>
            </div>

            <div class="tool-section">
                <h3>Colors</h3>
                <div class="color-palette" id="colorPalette"></div>
            </div>

            <div class="tool-section">
                <h3>Brush Size</h3>
                <div class="brush-sizes">
                    <button class="size-btn" data-size="2">
                        <div class="dot" style="width: 4px; height: 4px;"></div>
                    </button>
                    <button class="size-btn" data-size="5">
                        <div class="dot" style="width: 8px; height: 8px;"></div>
                    </button>
                    <button class="size-btn active" data-size="10">
                        <div class="dot" style="width: 12px; height: 12px;"></div>
                    </button>
                    <button class="size-btn" data-size="20">
                        <div class="dot" style="width: 16px; height: 16px;"></div>
                    </button>
                    <button class="size-btn" data-size="30">
                        <div class="dot" style="width: 20px; height: 20px;"></div>
                    </button>
                </div>
            </div>

            <div class="tool-section">
                <h3>Tools</h3>
                <div class="tool-buttons">
                    <button class="tool-btn active" data-tool="brush">🖌️ Brush</button>
                    <button class="tool-btn" data-tool="eraser">🧹 Eraser</button>
                    <button class="tool-btn" data-tool="fill">🪣 Fill</button>
                    <button class="tool-btn" data-tool="spray">💨 Spray</button>
                </div>
            </div>

            <div class="tool-section">
                <h3>Actions</h3>
                <div class="tool-buttons">
                    <button class="tool-btn" onclick="clearCanvas()">🗑️ Clear</button>
                    <button class="tool-btn" onclick="saveDrawing()">💾 Save</button>
                    <button class="tool-btn" onclick="undo()">↩️ Undo</button>
                    <button class="tool-btn" onclick="toggleBackground()">🌈 BG</button>
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth - 40;
            canvas.height = container.clientHeight - 40;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Drawing state
        let isDrawing = false;
        let currentColor = '#667eea';
        let brushSize = 10;
        let currentTool = 'brush';
        let undoStack = [];
        let bgWhite = true;

        // Therapeutic color palette
        const colors = [
            '#667eea', '#764ba2', '#f093fb', '#4facfe',
            '#43e97b', '#38f9d7', '#fa709a', '#fee140',
            '#30cfd0', '#330867', '#ff6b6b', '#4ecdc4',
            '#45b7d1', '#96ceb4', '#ffeaa7', '#dfe6e9',
            '#fd79a8', '#fdcb6e', '#e17055', '#74b9ff',
            '#a29bfe', '#55efc4', '#81ecec', '#fab1a0',
            '#000000', '#ffffff'
        ];

        // Generate color palette
        const colorPalette = document.getElementById('colorPalette');
        colors.forEach(color => {
            const btn = document.createElement('button');
            btn.className = 'color-btn';
            btn.style.background = color;
            if (color === currentColor) btn.classList.add('active');
            btn.onclick = () => selectColor(color, btn);
            colorPalette.appendChild(btn);
        });

        function selectColor(color, btn) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Brush size selection
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.onclick = () => {
                brushSize = parseInt(btn.dataset.size);
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
        });

        // Tool selection
        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.onclick = () => {
                currentTool = btn.dataset.tool;
                document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
        });

        // Save state for undo
        function saveState() {
            if (undoStack.length > 20) undoStack.shift();
            undoStack.push(canvas.toDataURL());
        }

        // Drawing functions
        function startDrawing(e) {
            isDrawing = true;
            saveState();
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing && currentTool !== 'fill') return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (currentTool === 'brush') {
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.strokeStyle = currentColor;
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (currentTool === 'eraser') {
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.strokeStyle = bgWhite ? 'white' : '#f5f5f5';
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (currentTool === 'spray') {
                for (let i = 0; i < 10; i++) {
                    const offsetX = (Math.random() - 0.5) * brushSize * 2;
                    const offsetY = (Math.random() - 0.5) * brushSize * 2;
                    ctx.fillStyle = currentColor;
                    ctx.fillRect(x + offsetX, y + offsetY, 2, 2);
                }
            } else if (currentTool === 'fill' && isDrawing) {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                floodFill(Math.floor(x), Math.floor(y), hexToRgb(currentColor), imageData);
                ctx.putImageData(imageData, 0, 0);
                isDrawing = false;
            }
        }

        // Flood fill algorithm
        function floodFill(x, y, fillColor, imageData) {
            const targetColor = getPixel(imageData, x, y);
            if (colorsMatch(targetColor, fillColor)) return;

            const stack = [[x, y]];
            while (stack.length) {
                const [px, py] = stack.pop();
                if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;

                const current = getPixel(imageData, px, py);
                if (!colorsMatch(current, targetColor)) continue;

                setPixel(imageData, px, py, fillColor);
                stack.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
            }
        }

        function getPixel(imageData, x, y) {
            const index = (y * imageData.width + x) * 4;
            return [imageData.data[index], imageData.data[index + 1], imageData.data[index + 2]];
        }

        function setPixel(imageData, x, y, color) {
            const index = (y * imageData.width + x) * 4;
            imageData.data[index] = color[0];
            imageData.data[index + 1] = color[1];
            imageData.data[index + 2] = color[2];
        }

        function colorsMatch(a, b) {
            return a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [
                parseInt(result[1], 16),
                parseInt(result[2], 16),
                parseInt(result[3], 16)
            ] : [0, 0, 0];
        }

        // Event listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const mouseEvent = new MouseEvent('mouseup', {});
            canvas.dispatchEvent(mouseEvent);
        });

        // Actions
        function clearCanvas() {
            if (confirm('Clear the canvas?')) {
                saveState();
                ctx.fillStyle = bgWhite ? 'white' : '#f5f5f5';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function saveDrawing() {
            const link = document.createElement('a');
            link.download = `color-therapy-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function undo() {
            if (undoStack.length > 0) {
                const img = new Image();
                img.src = undoStack.pop();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
            }
        }

        function toggleBackground() {
            bgWhite = !bgWhite;
            ctx.fillStyle = bgWhite ? 'white' : '#f5f5f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>

</html>
