<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Journal Assistant</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            padding: 2rem;
        }

        .feature-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-header {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter:backdrop-filter:
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .feature-header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter:backdrop-filter:
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .journal-editor {
            min-height: 400px;
        }

        .journal-textarea {
            width: 100%;
            min-height: 300px;
            padding: 1rem;
            border: 2px solid var(--gray-200);
            border-radius: 1rem;
            font-size: 1rem;
            font-family: inherit;
            line-height: 1.8;
            resize: vertical;
        }

        .journal-textarea:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .mood-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .mood-btn {
            padding: 1rem 0.5rem;
            background: var(--gray-100);
            border: 2px solid transparent;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .mood-btn:hover {
            background: var(--gray-200);
            transform: scale(1.05);
        }

        .mood-btn.selected {
            background: rgba(102, 126, 234, 0.1);
            border-color: var(--primary-purple);
        }

        .mood-btn .emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.25rem;
        }

        .mood-btn .label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-700);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem 2rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(102, 126, 234, 0.4);
        }

        .insights-panel {
            display: grid;
            gap: 1rem;
        }

        .insight-card {
            background: var(--gray-50);
            padding: 1rem;
            border-radius: 1rem;
            border-left: 4px solid var(--primary-purple);
        }

        .insight-card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .insight-card p {
            font-size: 0.875rem;
            color: var(--gray-600);
            line-height: 1.5;
        }

        .entries-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .entry-item {
            background: var(--gray-50);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .entry-item:hover {
            background: var(--gray-100);
            transform: translateX(5px);
        }

        .entry-date {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-bottom: 0.25rem;
        }

        .entry-preview {
            font-size: 0.875rem;
            color: var(--gray-700);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .entry-mood {
            font-size: 1.25rem;
            margin-right: 0.5rem;
        }

        .emotion-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .emotion-tag {
            padding: 0.25rem 0.75rem;
            background: rgba(102, 126, 234, 0.1);
            color: var(--primary-purple);
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .analytics-section {
            margin-top: 2rem;
        }

        .streak-display {
            text-align: center;
            padding: 2rem;
            background: var(--gradient-primary);
            border-radius: 1rem;
            color: white;
            margin-bottom: 1rem;
        }

        .streak-number {
            font-size: 3rem;
            font-weight: 700;
            display: block;
        }

        .streak-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
            margin-bottom: 1rem;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        .ai-analysis {
            background: rgba(102, 126, 234, 0.05);
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .ai-analysis h3 {
            color: var(--primary-purple);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="feature-container">
        <a href="../index.html" class="back-btn">
            <span>←</span> Back to Dashboard
        </a>

        <div class="feature-header">
            <h1>📝 AI Journal Assistant</h1>
            <p>Reflect, record, and gain insights from your daily thoughts and emotions</p>
        </div>

        <div class="layout-grid">
            <!-- Main Journal Editor -->
            <div>
                <div class="card journal-editor">
                    <h2><span>✍️</span> Today's Entry</h2>

                    <div class="mood-selector">
                        <div class="mood-btn" data-mood="😊" data-label="Happy">
                            <span class="emoji">😊</span>
                            <span class="label">Happy</span>
                        </div>
                        <div class="mood-btn" data-mood="😌" data-label="Calm">
                            <span class="emoji">😌</span>
                            <span class="label">Calm</span>
                        </div>
                        <div class="mood-btn" data-mood="😐" data-label="Neutral">
                            <span class="emoji">😐</span>
                            <span class="label">Neutral</span>
                        </div>
                        <div class="mood-btn" data-mood="😔" data-label="Sad">
                            <span class="emoji">😔</span>
                            <span class="label">Sad</span>
                        </div>
                        <div class="mood-btn" data-mood="😰" data-label="Anxious">
                            <span class="emoji">😰</span>
                            <span class="label">Anxious</span>
                        </div>
                        <div class="mood-btn" data-mood="😤" data-label="Frustrated">
                            <span class="emoji">😤</span>
                            <span class="label">Frustrated</span>
                        </div>
                    </div>

                    <textarea id="journal-entry" class="journal-textarea" placeholder="Write about your day, your thoughts, or anything on your mind...

Some prompts to get you started:
• What am I grateful for today?
• What challenged me today and how did I handle it?
• What emotions am I experiencing right now?
• What would I like to let go of?
• What am I looking forward to?"></textarea>

                    <button class="btn-primary" id="save-entry">Save Entry & Analyze</button>

                    <div id="ai-analysis-result" class="ai-analysis" style="display: none;">
                        <h3><span>🤖</span> AI Insights</h3>
                        <div id="analysis-content"></div>
                    </div>
                </div>

                <!-- Previous Entries -->
                <div class="card" style="margin-top: 1.5rem;">
                    <h2><span>📚</span> Previous Entries</h2>
                    <div class="entries-list" id="entries-list">
                        <!-- Entries will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div>
                <!-- Streak Counter -->
                <div class="card">
                    <div class="streak-display">
                        <span class="streak-number" id="journal-streak">0</span>
                        <span class="streak-label">Day Streak 🔥</span>
                    </div>
                </div>

                <!-- AI Insights -->
                <div class="card insights-panel">
                    <h2><span>💡</span> Weekly Insights</h2>
                    <div id="weekly-insights">
                        <!-- Insights will be loaded here -->
                    </div>
                </div>

                <!-- Emotion Tracking -->
                <div class="card" style="margin-top: 1.5rem;">
                    <h2><span>📊</span> Emotion Patterns</h2>
                    <div id="emotion-patterns">
                        <!-- Emotion data will be shown here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../utils/storage.js"></script>
    <script>
        let currentMood = null;
        let selectedEntry = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function () {
            setupMoodSelector();
            loadEntries();
            calculateStreak();
            generateWeeklyInsights();
            showEmotionPatterns();
        });

        // Setup mood selector
        function setupMoodSelector() {
            const moodButtons = document.querySelectorAll('.mood-btn');
            moodButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    moodButtons.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    currentMood = {
                        emoji: btn.getAttribute('data-mood'),
                        label: btn.getAttribute('data-label')
                    };
                });
            });
        }

        // Save journal entry
        document.getElementById('save-entry').addEventListener('click', function () {
            const content = document.getElementById('journal-entry').value.trim();

            if (!content) {
                alert('Please write something in your journal first!');
                return;
            }

            if (!currentMood) {
                alert('Please select your current mood!');
                return;
            }

            const entry = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                content: content,
                mood: currentMood,
                emotions: extractEmotions(content)
            };

            // Save to storage
            Storage.addJournalEntry(entry);
            Storage.incrementActivity();

            // Show AI analysis
            analyzeEntry(entry);

            // Clear form
            document.getElementById('journal-entry').value = '';
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
            currentMood = null;

            // Reload entries and insights
            loadEntries();
            calculateStreak();
            generateWeeklyInsights();
            showEmotionPatterns();

            alert('✅ Journal entry saved successfully!');
        });

        // Extract emotions from text (simple keyword-based)
        function extractEmotions(text) {
            const emotions = [];
            const keywords = {
                'grateful': '🙏 Gratitude',
                'thankful': '🙏 Gratitude',
                'happy': '😊 Happiness',
                'joy': '😊 Joy',
                'excited': '🎉 Excitement',
                'anxious': '😰 Anxiety',
                'worried': '😰 Worry',
                'stressed': '😫 Stress',
                'sad': '😔 Sadness',
                'angry': '😠 Anger',
                'frustrated': '😤 Frustration',
                'proud': '🌟 Pride',
                'accomplished': '🌟 Accomplishment',
                'loved': '❤️ Love',
                'hopeful': '🌈 Hope',
                'peaceful': '🕊️ Peace',
                'calm': '😌 Calm'
            };

            const lowerText = text.toLowerCase();
            for (const [keyword, emotion] of Object.entries(keywords)) {
                if (lowerText.includes(keyword) && !emotions.includes(emotion)) {
                    emotions.push(emotion);
                }
            }

            return emotions.length > 0 ? emotions : ['💭 Reflection'];
        }

        // AI Analysis (simulated - you can connect to real AI later)
        function analyzeEntry(entry) {
            const analysis = {
                summary: generateSummary(entry.content),
                suggestions: generateSuggestions(entry.emotions, entry.mood),
                patterns: detectPatterns(entry)
            };

            displayAnalysis(analysis);
        }

        function generateSummary(content) {
            const sentences = content.split(/[.!?]+/).filter(s => s.trim().length > 0);
            const wordCount = content.split(/\s+/).length;

            return `Your entry contains ${wordCount} words across ${sentences.length} thoughts. ` +
                `This shows ${wordCount > 100 ? 'deep' : 'concise'} reflection on your experiences.`;
        }

        function generateSuggestions(emotions, mood) {
            const suggestions = [];

            if (emotions.some(e => e.includes('Anxiety') || e.includes('Stress'))) {
                suggestions.push('Consider trying the breathing exercises or TIPP skills from Therapy Exercises');
            }

            if (emotions.some(e => e.includes('Gratitude'))) {
                suggestions.push('Great job practicing gratitude! This is linked to improved well-being');
            }

            if (mood.label === 'Sad' || mood.label === 'Frustrated') {
                suggestions.push('Try the Behavioral Activation exercise to plan mood-lifting activities');
            }

            if (suggestions.length === 0) {
                suggestions.push('Keep up the great work with journaling! Regular reflection builds emotional awareness');
            }

            return suggestions;
        }

        function detectPatterns(entry) {
            // Simple pattern detection based on recent entries
            const recentEntries = Storage.getRecentJournals(7);
            const moodCounts = {};

            recentEntries.forEach(e => {
                const mood = e.mood?.label || 'Unknown';
                moodCounts[mood] = (moodCounts[mood] || 0) + 1;
            });

            const dominantMood = Object.entries(moodCounts)
                .sort((a, b) => b[1] - a[1])[0];

            return dominantMood ?
                `Over the past week, you've been mostly ${dominantMood[0].toLowerCase()}` :
                'Keep journaling to see patterns in your emotions';
        }

        function displayAnalysis(analysis) {
            const analysisDiv = document.getElementById('ai-analysis-result');
            const contentDiv = document.getElementById('analysis-content');

            contentDiv.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    <strong>📊 Summary:</strong>
                    <p style="margin-top: 0.5rem;">${analysis.summary}</p>
                </div>
                <div style="margin-bottom: 1rem;">
                    <strong>💡 Suggestions:</strong>
                    <ul style="margin-top: 0.5rem; margin-left: 1.5rem;">
                        ${analysis.suggestions.map(s => `<li>${s}</li>`).join('')}
                    </ul>
                </div>
                <div>
                    <strong>🔍 Pattern Detected:</strong>
                    <p style="margin-top: 0.5rem;">${analysis.patterns}</p>
                </div>
            `;

            analysisDiv.style.display = 'block';
        }

        // Load previous entries
        function loadEntries() {
            const entries = Storage.getRecentJournals(10);
            const entriesList = document.getElementById('entries-list');

            if (entries.length === 0) {
                entriesList.innerHTML = '<p style="color: var(--gray-500); text-align: center; padding: 2rem;">No entries yet. Start journaling!</p>';
                return;
            }

            entriesList.innerHTML = entries.map(entry => `
                <div class="entry-item" onclick="viewEntry(${entry.id})">
                    <div class="entry-date">
                        ${entry.mood ? `<span class="entry-mood">${entry.mood.emoji}</span>` : ''}
                        ${formatDate(entry.timestamp)}
                    </div>
                    <div class="entry-preview">${entry.content.substring(0, 100)}...</div>
                    ${entry.emotions && entry.emotions.length > 0 ? `
                        <div class="emotion-tags">
                            ${entry.emotions.slice(0, 3).map(e => `<span class="emotion-tag">${e}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // View specific entry
        function viewEntry(entryId) {
            const entries = Storage.load(Storage.KEYS.JOURNAL_ENTRIES);
            const entry = entries.find(e => e.id === entryId);

            if (entry) {
                alert(`Entry from ${formatDate(entry.timestamp)}:\n\n${entry.content}`);
            }
        }

        // Calculate journal streak
        function calculateStreak() {
            const entries = Storage.load(Storage.KEYS.JOURNAL_ENTRIES) || [];
            let streak = 0;
            let currentDate = new Date();
            currentDate.setHours(0, 0, 0, 0);

            // Sort entries by date
            const sortedEntries = entries.sort((a, b) =>
                new Date(b.timestamp) - new Date(a.timestamp)
            );

            for (let i = 0; i < sortedEntries.length; i++) {
                const entryDate = new Date(sortedEntries[i].timestamp);
                entryDate.setHours(0, 0, 0, 0);

                const daysDiff = Math.floor((currentDate - entryDate) / (1000 * 60 * 60 * 24));

                if (daysDiff === streak) {
                    streak++;
                    currentDate.setDate(currentDate.getDate() - 1);
                } else {
                    break;
                }
            }

            document.getElementById('journal-streak').textContent = streak;
        }

        // Generate weekly insights
        function generateWeeklyInsights() {
            const entries = Storage.getRecentJournals(7);
            const insightsDiv = document.getElementById('weekly-insights');

            if (entries.length === 0) {
                insightsDiv.innerHTML = '<p style="color: var(--gray-500); font-size: 0.875rem;">Journal for a week to see insights</p>';
                return;
            }

            // Count emotions
            const emotionCounts = {};
            entries.forEach(entry => {
                entry.emotions?.forEach(emotion => {
                    emotionCounts[emotion] = (emotionCounts[emotion] || 0) + 1;
                });
            });

            const topEmotion = Object.entries(emotionCounts)
                .sort((a, b) => b[1] - a[1])[0];

            insightsDiv.innerHTML = `
                <div class="insight-card">
                    <h3><span>📈</span> Entry Frequency</h3>
                    <p>You've journaled ${entries.length} times this week!</p>
                </div>
                ${topEmotion ? `
                    <div class="insight-card">
                        <h3><span>💭</span> Dominant Theme</h3>
                        <p>${topEmotion[0]} appeared most frequently in your entries</p>
                    </div>
                ` : ''}
                <div class="insight-card">
                    <h3><span>🎯</span> Tip</h3>
                    <p>Regular journaling improves emotional awareness and mental clarity</p>
                </div>
            `;
        }

        // Show emotion patterns
        function showEmotionPatterns() {
            const entries = Storage.getRecentJournals(7);
            const patternsDiv = document.getElementById('emotion-patterns');

            if (entries.length === 0) {
                patternsDiv.innerHTML = '<p style="color: var(--gray-500); font-size: 0.875rem;">No data yet</p>';
                return;
            }

            const moodCounts = {};
            entries.forEach(entry => {
                const mood = entry.mood?.label || 'Unknown';
                moodCounts[mood] = (moodCounts[mood] || 0) + 1;
            });

            patternsDiv.innerHTML = Object.entries(moodCounts)
                .map(([mood, count]) => {
                    const percentage = (count / entries.length * 100).toFixed(0);
                    return `
                        <div style="margin-bottom: 1rem;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                                <span style="font-weight: 600; font-size: 0.875rem;">${mood}</span>
                                <span style="color: var(--gray-600); font-size: 0.875rem;">${percentage}%</span>
                            </div>
                            <div style="background: var(--gray-200); height: 8px; border-radius: 4px; overflow: hidden;">
                                <div style="background: var(--gradient-primary); height: 100%; width: ${percentage}%;"></div>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>

</html>
